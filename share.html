<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=760">
<title>Work Wins Pool, group-text standings</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;background:#0A1F14}
a{color:#C9A24B}a:hover{color:#E2BE6A}
</style>
<script src="nfl.js?v=1" defer></script>
<script src="league.js?v=1" defer></script>
<script src="pool.js?v=1" defer></script>
<script src="support.js?v=1" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 720px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: 22px; background-color: #0A1F14; background-image: radial-gradient(ellipse at 8% -4%, rgba(255,248,214,.16), transparent 38%), radial-gradient(ellipse at 92% -4%, rgba(255,248,214,.16), transparent 38%), repeating-linear-gradient(90deg, rgba(239,237,224,.045) 0 1px, transparent 1px 72px); color: #EFEDE0; font-family: 'Libre Franklin', system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; border: 3px solid #C9A24B; border-radius: 10px; padding: 26px 30px 24px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 20px">
<svg width="84" height="101" viewBox="0 0 60 72" aria-hidden="true" style="flex: none"><path d="M30 3 L56 11 V35 C56 52 45 62 30 69 C15 62 4 52 4 35 V11 Z" fill="#14452C" stroke="#C9A24B" stroke-width="3"></path><path d="M30 9 L50 15 V35 C50 48 42 56 30 62 C18 56 10 48 10 35 V15 Z" fill="none" stroke="#9CCB55" stroke-opacity=".45" stroke-width="1"></path><ellipse cx="30" cy="35" rx="12" ry="7.5" fill="#9A5530" transform="rotate(-28 30 35)"></ellipse><path d="M24.5 38.5 L35.5 31.5" stroke="#F4F1E4" stroke-width="1.6"></path><path d="M27 34 L29 37.5 M29.5 32.6 L31.5 36 M32 31.2 L34 34.6" stroke="#F4F1E4" stroke-width="1.2"></path><rect x="18" y="49" width="24" height="9" rx="2" fill="#0A1F14" stroke="#C9A24B" stroke-width="1"></rect><text x="30" y="56.2" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="7" fill="#EFEDE0" letter-spacing=".6">2026</text></svg>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<span style="font-family: Anton, Impact, 'Arial Narrow', sans-serif; font-size: 46px; line-height: .95; letter-spacing: .02em">{{leagueUpper}}</span>
<span style="font-size: 19px; font-weight: 800; letter-spacing: .14em; color: #9CCB55">{{subtitle}}</span>
</div>
<span style="align-self: flex-start; font-size: 15px; font-weight: 800; letter-spacing: .08em; padding: 6px 10px; border: 1.5px solid #C9A24B; border-radius: 4px; color: #C9A24B">{{status}}</span>
</div>

<div style="display: flex; flex-direction: column; background: #051109; border: 1px solid #1D4530; border-radius: 8px; padding: 4px 20px 2px">
<div style="display: grid; grid-template-columns: 50px minmax(0, 1fr) 80px 80px 60px; gap: 12px; padding: 10px 0 6px; font-size: 14px; font-weight: 700; color: #8FA898; letter-spacing: .04em"><span></span><span>COACH</span><span style="text-align: right">WEEK {{week}}</span><span style="text-align: right">POINTS</span><span style="text-align: right">MOVE</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 50px minmax(0, 1fr) 80px 80px 60px; gap: 12px; align-items: center; height: 68px; border-top: 1px solid #143322">
<span style="font-family: Anton, Impact, sans-serif; font-size: 26px; color: #8FA898; text-align: right">{{r.rk}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-family: Anton, Impact, sans-serif; font-size: 34px; line-height: 1.05; letter-spacing: .02em; color: {{r.nameColor}}">{{r.name}}</span><span style="font-size: 14px; color: #8FA898; letter-spacing: .06em">{{r.teams}}</span></span>
<span style="font-size: 20px; font-weight: 600; color: #C3D2C7; text-align: right; font-variant-numeric: tabular-nums">{{r.wk}}</span>
<span style="font-family: Anton, Impact, sans-serif; font-size: 52px; line-height: 1; text-align: right; color: {{r.ptsColor}}">{{r.pts}}</span>
<span style="font-size: 19px; font-weight: 800; text-align: right; color: {{r.mvColor}}">{{r.mv}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto">
<span style="font-size: 21px; font-weight: 700; line-height: 1.35">{{line1}}</span>
<span style="font-size: 17px; line-height: 1.4; color: #C3D2C7">{{line2}}</span>
<div style="display: flex; justify-content: center; margin-top: 12px; padding-top: 14px; border-top: 1px solid #1D4530">
<span style="font-size: 14px; font-weight: 800; letter-spacing: .1em; color: #9CCB55">{{tagline}}</span>
</div>
</div>

</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var P = window.POOL;
    // The latest week; while it's being played the image says SO FAR instead of FINAL.
    var wk = Math.max(P.latest, 1), live = P.live(wk);
    var t = P.table(wk), prev = wk > 1 ? P.table(wk - 1).rank : null;
    var rows = t.order.map(function (c, i) {
      var mv = prev ? prev[c] - t.rank[c] : 0;
      return {
        rk: t.label(c), name: c.toUpperCase(), teams: P.roster[c].join(' · '), wk: P.fmtRec(t.rec[c]), pts: t.pts[c],
        nameColor: i === 0 ? '#C9A24B' : '#EFEDE0', ptsColor: i === 0 ? '#C9A24B' : '#EFEDE0',
        mv: !prev ? '' : mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : '–', mvColor: mv > 0 ? '#9CCB55' : '#8FA898'
      };
    });
    var leaders = t.order.filter(function (c) { return t.rank[c] === 1; });
    var wkPts = function (c) { return t.rec[c][0] + t.rec[c][2] / 2; };
    var best = Math.max.apply(null, P.coaches.map(wkPts));
    var bestCoaches = t.order.filter(function (c) { return wkPts(c) === best; });
    var left = P.pending(wk).length;
    return { rows: rows, week: wk, status: live ? 'SO FAR' : 'FINAL',
      subtitle: (live ? 'WEEK ' + wk + ' SO FAR' : 'STANDINGS AFTER WEEK ' + wk),
      line1: P.headline(wk) + '. ' + (leaders.length === 1 ? leaders[0] + ' has first place alone with ' : P.list(leaders) + ' share first with ') + t.pts[leaders[0]] + ' points.',
      line2: (live ? left + (left === 1 ? ' game' : ' games') + ' still to play. ' : '') + 'Best week' + (live ? ' so far' : '') + ': ' + P.list(bestCoaches) + ' at ' + P.fmtRec(t.rec[bestCoaches[0]]) + '.' };
  }
}
</script>
</body>
</html>
