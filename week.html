<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    var mode = this.props.mode ?? 'dark';
    var P = window.POOL, N = window.NFL;
    var C = P.coaches, OWN = P.own, weeks = P.weeks, latest = P.latest;
    var SEASON_WEEKS = N.SEASON_WEEKS, SHOWN_WEEKS = 6;
    // No w= in the address opens the latest week, so the home page never needs changing.
    var m = /[?&]w=(\d+)/.exec(location.search);
    var wk = Math.min(Math.max(m ? +m[1] : latest, 1), latest);
    var pending = P.pending(wk);
    var live = pending.length > 0;
    var who = function (t) { return OWN[t] || '—'; };

    var t = P.table(wk), prevT = wk > 1 ? P.table(wk - 1) : null;
    var pts = t.pts, rank = t.rank, rec = t.rec, prev = prevT && prevT.rank, order = t.order;
    var standings = order.map(function (c, i) {
      var mv = prev ? prev[c] - rank[c] : 0, lead = rank[c] === 1;
      return {
        rk: t.label(c), name: c, teams: P.roster[c].join(' '), wk: P.fmtRec(rec[c]), pts: pts[c],
        nameColor: lead ? '#C9A24B' : '#EFEDE0', ptsColor: lead ? '#C9A24B' : '#EFEDE0',
        mv: !prev ? '' : mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : '–',
        mvColor: mv > 0 ? '#9CCB55' : '#8FA898',
        mvLabel: !prev ? 'first week' : mv > 0 ? 'up ' + mv : mv < 0 ? 'down ' + (-mv) : 'no change'
      };
    });

    var list = P.list;
    var leaders = order.filter(function (c) { return rank[c] === 1; });
    var wkPts = function (c) { return rec[c][0] + rec[c][2] / 2; };
    var best = Math.max.apply(null, C.map(wkPts));
    var bestCoaches = order.filter(function (c) { return wkPts(c) === best; });
    var gamesLeft = pending.length === 1 ? '1 game' : pending.length + ' games';
    var summary = list(leaders) + (leaders.length > 1 ? ' share first' : ' leads') + ' with ' + pts[leaders[0]] + ' points' +
      (live ? ', and ' + gamesLeft + (pending.length === 1 ? ' is' : ' are') + ' still to play this week. Best week so far: ' : ' after Week ' + wk + '. Best week: ') +
      list(bestCoaches) + ' at ' + P.fmtRec(rec[bestCoaches[0]]) + '.';

    var ledger = weeks[wk - 1].map(function (g) {
      var tie = g.as === g.hs, aw = g.as > g.hs;
      return {
        a: g.a, ac: who(g.a) + (tie ? '  +½' : aw ? '  +1' : ''), as: g.as, h: g.h, hc: who(g.h) + (tie ? '  +½' : aw ? '' : '  +1'), hs: g.hs,
        aColor: aw || tie ? 'var(--ink)' : 'var(--soft)', hColor: !aw || tie ? 'var(--ink)' : 'var(--soft)',
        aWeight: aw && !tie ? '700' : '400', hWeight: !aw && !tie ? '700' : '400'
      };
    });
    var upcoming = pending.map(function (g) { return { day: g[0], a: g[1], ac: who(g[1]), h: g[2], hc: who(g[2]) }; });

    var weekChips = [];
    for (var n = 1; n <= Math.min(Math.max(SHOWN_WEEKS, latest + 1), SEASON_WEEKS); n++) {
      var cur = n === wk, played = n <= latest;
      weekChips.push({ n: n, link: played, future: !played, href: P.weekHref(n), current: cur ? 'page' : 'false',
        border: cur ? 'var(--gold)' : 'var(--line)', bg: cur ? 'var(--gold)' : 'var(--panel)', fg: cur ? 'var(--ongold)' : 'var(--ink)', weight: cur ? '800' : '700' });
    }

    var deskWeeks = [];
    for (var d = 1; d <= SEASON_WEEKS; d++) {
      var dcur = d === wk, dpast = d <= latest;
      deskWeeks.push({ n: d, href: dcur ? 'week.html?w=' + d : dpast ? P.weekHref(d) : 'season.html', current: dcur ? 'page' : 'false',
        border: dcur ? '1px solid var(--gold)' : dpast ? '1px solid var(--line)' : '1px dashed var(--line)',
        bg: dcur ? 'var(--gold)' : dpast ? 'var(--panel)' : 'transparent',
        fg: dcur ? 'var(--ongold)' : dpast ? 'var(--ink)' : 'var(--soft)', weight: dcur ? '800' : dpast ? '700' : '500',
        opacity: dpast ? '1' : '.6' });
    }
    var isCurrent = wk === latest;

    document.title = window.LEAGUE.NAME + ', Week ' + wk;
    return {
      modeClass: 'wwp-' + mode, week: wk, weekChips: weekChips, standings: standings, ledger: ledger, summary: summary,
      upcoming: upcoming, live: live,
      deskWeeks: deskWeeks,
      navCurrent: isCurrent ? 'page' : 'false', navWeight: isCurrent ? '700' : '600', navColor: isCurrent ? 'var(--ink)' : 'var(--soft)', navShadow: isCurrent ? 'inset 0 -3px 0 var(--gold)' : 'none',
      headline: P.headline(wk),
      statusLabel: live ? 'So far' : 'Final',
      kicker: 'Week ' + wk + (live ? ' · In progress · ' + weeks[wk - 1].length + ' of ' + (weeks[wk - 1].length + pending.length) + ' games final' : ' · Final · Games ' + P.weekDates(wk)),
      standingsNote: 'Big number is total points.' + (prev ? ' Arrows are places moved since Week ' + (wk - 1) + '.' : '') + ' Tied coaches share a rank.' + (live ? ' Updates as games finish.' : '')
    };
  }
}
</script>
